<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演歌</title>
<meta name="theme-color" content="#FAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="演歌">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EF;
    --card: #FFFFFF;
    --ink: #2A2320;
    --ink-soft: #6E625B;
    --line: #E9E1D6;
    --accent: #B8325A;
    --accent-soft: #F6E3E8;
    --shadow: 0 1px 2px rgba(60,40,30,.06), 0 4px 16px rgba(60,40,30,.06);
    --radius: 20px;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 22px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .screen { display: none; min-height: 100%; }
  .screen.on { display: block; }

  /* ---------- 歡迎畫面 ---------- */
  #hello {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: var(--bg);
    transition: opacity .7s ease;
  }
  #hello.fade { opacity: 0; pointer-events: none; }
  #hello img { width: 132px; height: 132px; border-radius: 30px; box-shadow: var(--shadow); }
  #hello h1 {
    margin: 0; font-family: var(--serif); font-weight: 700;
    font-size: clamp(52px, 14vw, 96px); letter-spacing: .06em;
    animation: rise 1s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---------- 密碼畫面 ---------- */
  #lock {
    position: fixed; inset: 0; z-index: 9; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  #lock[hidden] { display: none; }
  #lock h2 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: .06em; }
  .dots { display: flex; gap: 16px; height: 28px; align-items: center; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--accent); }
  .dots i.f { background: var(--accent); }
  .dots.shake { animation: shake .4s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .lockmsg { min-height: 30px; margin: -6px 0 0; font-size: 22px; color: var(--accent); font-weight: 700; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: min(100%, 360px); }
  .pad button {
    aspect-ratio: 1.25; border-radius: 22px; font-size: 38px; font-weight: 700;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    transition: transform .1s ease;
  }
  .pad button:active { transform: scale(.94); background: var(--accent-soft); }
  .pad button.txt { font-size: 22px; background: transparent; box-shadow: none; border-color: transparent; }

  /* ---------- 歌單 ---------- */
  .wrap { max-width: 980px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  header.top { display: flex; align-items: center; gap: 16px; margin: 4px 4px 24px; }
  header.top img { width: 56px; height: 56px; border-radius: 14px; }
  header.top h2 { margin: 0; font-family: var(--serif); font-size: 36px; font-weight: 700; letter-spacing: .08em; }
  .list { display: grid; grid-template-columns: 1fr; gap: 14px; list-style: none; padding: 0; margin: 0; }
  @media (min-width: 700px) { .list { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1100px) { .wrap { max-width: 1180px; } .list { grid-template-columns: 1fr 1fr 1fr; } }
  .song {
    width: 100%; min-height: 84px;
    display: flex; align-items: center; gap: 18px;
    padding: 14px 20px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .song:active { transform: scale(.98); border-color: var(--accent); }
  .song .num {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-size: 22px; font-weight: 700;
  }
  .song .name { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.25; }

  /* ---------- 播放畫面 ---------- */
  #player .wrap { padding-top: calc(env(safe-area-inset-top) + 16px); }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .back {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    min-height: 60px; padding: 0 22px 0 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    font-size: 24px; font-weight: 700; box-shadow: var(--shadow);
  }
  .back svg { width: 30px; height: 30px; }
  .now { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.2; }
  .stage { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; box-shadow: var(--shadow); }
  .stage video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .stage .msg {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 20px;
    color: #fff; font-size: 24px; background: rgba(0,0,0,.55);
  }
  .stage .msg.on { display: grid; }

  .progress { display: flex; align-items: center; gap: 14px; margin: 18px 4px 6px; font-size: 20px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .progress input { flex: 1; height: 44px; accent-color: var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p,0%), var(--line) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }

  .voice { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0; padding: 6px; background: #EFE8DE; border-radius: 24px; }
  .voice button {
    min-height: 76px; border-radius: 18px; font-size: 26px; font-weight: 700; color: var(--ink-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
    transition: background .15s ease, color .15s ease;
  }
  .voice button small { font-size: 16px; font-weight: 500; opacity: .8; margin-top: 2px; }
  .voice button[aria-pressed=true] { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }

  .keyrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 0 0 14px; }
  .keyrow button {
    min-height: 80px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
    font-size: 24px; font-weight: 700; transition: transform .12s ease;
  }
  .keyrow button:active { transform: scale(.97); }
  .keyrow button small { font-size: 15px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; }
  .keyrow button:disabled { opacity: .35; }
  .keyrow .keyval { background: transparent; border-color: transparent; box-shadow: none; }
  .keyrow .keyval span { font-size: 28px; color: var(--ink); }
  .keyrow .keyval.changed span { color: var(--accent); }
  .ctrls { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
  .ctrl {
    min-height: 96px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 22px; font-weight: 700;
    transition: transform .12s ease;
  }
  .ctrl:active { transform: scale(.97); }
  .ctrl svg { width: 36px; height: 36px; }
  .ctrl.play { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 24px; }
  .ctrl[aria-pressed=true]:not(.play) { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  /* 全螢幕 */
  .stage.fs { border-radius: 0; aspect-ratio: auto; width: 100vw; height: 100vh; height: 100dvh; box-shadow: none; }
  .stage:fullscreen { border-radius: 0; aspect-ratio: auto; width: 100%; height: 100%; }
  .stage:-webkit-full-screen { border-radius: 0; width: 100%; height: 100%; }
  .fsbar {
    position: absolute; left: 0; right: 0; bottom: 0; display: none; gap: 12px; justify-content: center;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);
    background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0));
    transition: opacity .3s ease;
  }
  .stage.fs .fsbar { display: flex; }
  .stage.fs.idle .fsbar { opacity: 0; pointer-events: none; }
  .fsbar button {
    min-width: 130px; min-height: 72px; padding: 0 22px; border-radius: 18px;
    background: rgba(255,255,255,.92); color: var(--ink); font-size: 24px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .fsbar button svg { width: 30px; height: 30px; }
  .fsbar .fsplay { background: var(--accent); color: #fff; }
  .fsbar .fsvoice { color: var(--accent); }
  /* 錄音（試做） */
  .rec { margin-top: 18px; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .rec[hidden] { display: none; }
  .rec h3 { margin: 0 0 12px; font-size: 22px; }
  .recbtn {
    width: 100%; min-height: 84px; border-radius: 18px; background: #C62F2F; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 26px; font-weight: 700;
  }
  .recbtn .dot { width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .recbtn.on { background: var(--ink); }
  .recbtn.on .dot { border-radius: 4px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .rechint { margin: 10px 2px 0; font-size: 17px; color: var(--ink-soft); line-height: 1.5; }
  .takes { display: grid; gap: 10px; margin-top: 12px; }
  .take { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
  .take b { font-size: 20px; }
  .take small { display: block; font-size: 15px; color: var(--ink-soft); font-weight: 500; }
  .take button { min-height: 56px; min-width: 64px; padding: 0 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 19px; font-weight: 700; }
  .take button.pl { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.45); color: #fff; font-size: 120px; font-weight: 700; }
  .count.on { display: grid; }
  .recbadge { position: absolute; top: 12px; left: 12px; display: none; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(198,47,47,.92); color: #fff; font-size: 18px; font-weight: 700; }
  .recbadge.on { display: inline-flex; }
  .recbadge::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
  .note { margin: 18px 4px 0; font-size: 17px; color: var(--ink-soft); text-align: center; }
  @media (min-width: 900px) {
    #player .grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 24px; align-items: start; }
    .voice { margin-top: 0; }
    .ctrls { grid-template-columns: 1fr; }
    .ctrl { flex-direction: row; gap: 12px; min-height: 80px; }
  }
</style>
</head>
<body>

<div id="hello" role="button" aria-label="進入">
  <img src="../icons/icon-512.png" alt="">
  <h1>こんにちは</h1>
</div>

<div id="lock" aria-label="輸入密碼">
  <h2>請輸入密碼</h2>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="lockmsg" id="lockmsg" aria-live="polite"></p>
  <div class="pad" id="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="txt" data-k="clear">清除</button><button>0</button><button class="txt" data-k="back">刪除</button>
  </div>
</div>

<section id="list" class="screen on" aria-label="歌單">
  <div class="wrap">
    <header class="top">
      <img src="../icons/icon-192.png" alt="">
      <h2>演歌</h2>
    </header>
    <ul class="list" id="songs"></ul>
  </div>
</section>

<section id="player" class="screen" aria-label="播放">
  <div class="wrap">
    <div class="bar">
      <button class="back" id="back" aria-label="回歌單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        回歌單
      </button>
      <div class="now" id="now"></div>
    </div>
    <div class="grid">
      <div>
        <div class="stage" id="stage">
          <video id="video" playsinline webkit-playsinline preload="metadata"></video>
          <div class="msg" id="msg"></div>
          <div class="count" id="count"></div>
          <div class="recbadge" id="recBadge">錄音中 <span id="recTime">0:00</span></div>
          <div class="fsbar" id="fsbar">
            <button class="fsplay" id="fsPlay">暫停</button>
            <button class="fsvoice" id="fsVoice">有人聲</button>
            <button id="fsExit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M9 20v-5H4"/><path d="M15 20v-5h5"/></svg>
              離開全螢幕
            </button>
          </div>
        </div>
        <div class="progress">
          <span id="cur">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放進度">
          <span id="dur">0:00</span>
        </div>
      </div>
      <div>
        <div class="voice" role="group" aria-label="聲音">
          <button id="vVocal" aria-pressed="true">有人聲<small>歌手演唱</small></button>
          <button id="vKara" aria-pressed="false">純伴奏<small>只有旋律</small></button>
        </div>
        <div class="keyrow" role="group" aria-label="升降 Key">
          <button id="keyDown" aria-label="降 Key">降 Key<small>聲音低一點</small></button>
          <button id="keyReset" class="keyval" aria-label="回到原調"><span id="keyVal">原調</span><small id="keyHint">目前音高</small></button>
          <button id="keyUp" aria-label="升 Key">升 Key<small>聲音高一點</small></button>
        </div>
        <div class="ctrls">
          <button class="ctrl play" id="play" aria-label="播放">
            <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
            <span id="playTxt">播放</span>
          </button>
          <button class="ctrl" id="loop" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
            <span>重複</span>
          </button>
          <button class="ctrl" id="full">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
            <span>全螢幕</span>
          </button>
        </div>
        <div class="rec" id="recBox" hidden>
          <h3>唱歌錄音</h3>
          <button class="recbtn" id="recBtn"><span class="dot"></span><span id="recTxt">開始錄我唱的歌</span></button>
          <p class="rechint" id="recHint">按下後會自動切到「純伴奏」，倒數 3 秒從頭開始。建議戴有線耳機，錄起來最清楚。</p>
          <div class="takes" id="takes"></div>
        </div>
        <p class="note" id="note"></p>
      </div>
    </div>
  </div>
</section>

<script>
/* ===== 設定：影片放在哪裡 =====
   VIDEO_BASE 是影片倉庫的網址；每首歌的檔名為 AVSEQ01.mov ~ AVSEQ16.mov */
const VIDEO_BASE = window.ENGA_VIDEO_BASE || "https://pub-a8f97bad0e354c668c1779fd893493fc.r2.dev/";

const SONGS = [
  "紅の舟唄", "北の旅人", "大阪恋しずく", "思案橋ブルース",
  "黒髪", "風姿花傳", "ひとりごと", "秋霖",
  "雪國", "昭和ひとり旅", "雨の空港", "ひとり上手",
  "あかね空", "好きになった人", "涙をありがとう", "達者でナ"
];
const fileFor = i => window.ENGA_FILES ? window.ENGA_FILES[i] : VIDEO_BASE + "AVSEQ" + String(i + 1).padStart(2, "0") + ".mov";

const $ = id => document.getElementById(id);
const video = $("video");

/* ---------- 歡迎畫面 ---------- */
const hello = $("hello");
let helloDone = false;
function closeHello() {
  if (helloDone) return; helloDone = true;
  hello.classList.add("fade");
  setTimeout(() => hello.remove(), 800);
}
hello.addEventListener("click", closeHello);
setTimeout(closeHello, 2200);

/* ---------- 密碼 ----------
   只存密碼的「指紋」，不直接寫出密碼。每次打開都要輸入；
   離開 App 超過 1 分鐘再回來，也要重新輸入。 */
const PASS_HASH = "c4e17c4557486760574b8619b1c3ee54eb70a7678d9e0f848849f9440b29afc0";
const lock = $("lock");
let typed = "", leftAt = 0;
function relock() {
  typed = ""; paintDots(); $("lockmsg").textContent = "";
  lock.style.transition = ""; lock.style.opacity = 1; lock.hidden = false;
  if (typeof rec !== "undefined" && rec) stopRec();
  if (!video.paused) video.pause();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") leftAt = Date.now();
  else if (leftAt && Date.now() - leftAt > 60000) relock();
});
window.addEventListener("pageshow", e => { if (e.persisted) relock(); });
async function hashOf(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("enga-salt-" + s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function paintDots() { [...$("dots").children].forEach((d, i) => d.classList.toggle("f", i < typed.length)); }
$("pad").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  $("lockmsg").textContent = "";
  if (b.dataset.k === "clear") typed = "";
  else if (b.dataset.k === "back") typed = typed.slice(0, -1);
  else if (typed.length < 6) typed += b.textContent;
  paintDots();
  if (typed.length === 6) {
    if (await hashOf(typed) === PASS_HASH) {
      lock.style.transition = "opacity .4s ease"; lock.style.opacity = 0;
      setTimeout(() => { lock.hidden = true; }, 400);
    } else {
      $("lockmsg").textContent = "密碼不對，請再試一次";
      $("dots").classList.add("shake");
      setTimeout(() => { $("dots").classList.remove("shake"); typed = ""; paintDots(); }, 450);
    }
  }
});

/* ---------- 歌單 ---------- */
const ul = $("songs");
SONGS.forEach((name, i) => {
  if (window.ENGA_FILES && !window.ENGA_FILES[i]) return;
  const li = document.createElement("li");
  li.innerHTML = `<button class="song"><span class="num">${i + 1}</span><span class="name"></span></button>`;
  li.querySelector(".name").textContent = name;
  li.firstChild.addEventListener("click", () => openSong(i));
  ul.appendChild(li);
});
if (!SONGS.length) {
  const li = document.createElement("li");
  li.style.cssText = "padding:40px 8px;text-align:center;color:var(--ink-soft);font-size:26px";
  li.textContent = "歌單準備中，敬請期待";
  ul.appendChild(li);
}

/* ---------- 聲音：左右聲道切換 ----------
   右聲道 = 有人聲，左聲道 = 純伴奏。選定的那一邊會同時從兩耳播出。 */
let ctx = null, gLeft, gRight, master, audioOk = false;
let voice = "vocal";   // "vocal" 或 "kara"
let muted = false;

function setupAudio() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  try {
    // iPhone：讓靜音鍵不影響播放
    if (navigator.audioSession) { try { navigator.audioSession.type = "playback"; } catch (e) {} }
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    const src = ctx.createMediaElementSource(video);
    const split = ctx.createChannelSplitter(2);
    const merge = ctx.createChannelMerger(2);
    gLeft = ctx.createGain(); gRight = ctx.createGain(); master = ctx.createGain();
    src.connect(split);
    split.connect(gLeft, 0);
    split.connect(gRight, 1);
    for (const g of [gLeft, gRight]) { g.connect(merge, 0, 0); g.connect(merge, 0, 1); }
    merge.connect(master);
    master.connect(ctx.destination);
    audioOk = true;
    loadPitch(merge);
    applyVoice(true);
    applyMute(true);
  } catch (e) {
    console.warn("Web Audio 無法使用", e);
    audioOk = false;
    ["keyDown", "keyUp", "keyReset"].forEach(id => $(id).disabled = true);
    $("note").textContent = "這台裝置不支援切換人聲／伴奏，會同時播出兩者。";
  }
}
/* ---------- 升降 Key ---------- */
const KEY_MIN = -6, KEY_MAX = 6;
let keyShift = 0, pitchNode = null;
/* 新手機用 AudioWorklet；舊的 iPhone／Android 不支援時，改用 ScriptProcessor 做同樣的事 */
function scriptPitch() {
  const win = Math.round(ctx.sampleRate * 0.07), size = win * 2 + 256;
  const buf = new Float32Array(size);
  let w = 0, phase = 0, st = 0;
  const node = ctx.createScriptProcessor(2048, 2, 2);
  const read = d => { let pos = w - d; while (pos < 0) pos += size; const i = Math.floor(pos), f = pos - i;
    const a = buf[i % size], b = buf[(i + 1) % size]; return a + (b - a) * f; };
  node.onaudioprocess = e => {
    const x0 = e.inputBuffer.getChannelData(0), o0 = e.outputBuffer.getChannelData(0), o1 = e.outputBuffer.getChannelData(1);
    const step = (1 - Math.pow(2, st / 12)) / win;
    for (let k = 0; k < x0.length; k++) {
      const x = x0[k]; buf[w] = x; let y;
      if (st === 0) y = x;
      else {
        let p1 = phase, p2 = p1 + 0.5; if (p2 >= 1) p2 -= 1;
        y = read(p1 * win + 1) * Math.sin(Math.PI * p1) ** 2 + read(p2 * win + 1) * Math.sin(Math.PI * p2) ** 2;
        phase += step; if (phase >= 1) phase -= 1; else if (phase < 0) phase += 1;
      }
      o0[k] = y; o1[k] = y; w = (w + 1) % size;
    }
  };
  return { node, set: v => { st = v; }, kind: "script" };
}
async function workletPitch() {
  if (!ctx.audioWorklet || !window.AudioWorkletNode) throw new Error("no worklet");
  await Promise.race([
    ctx.audioWorklet.addModule("../pitch-worklet.js"),
    new Promise((_, no) => setTimeout(() => no(new Error("worklet timeout")), 4000))
  ]);
  const node = new AudioWorkletNode(ctx, "pitch-shifter", { outputChannelCount: [2] });
  return { node, set: v => node.parameters.get("semitones").setValueAtTime(v, ctx.currentTime), kind: "worklet" };
}
async function loadPitch(merge) {
  let ctl = null;
  try { if (window.ENGA_FORCE_SCRIPT) throw new Error("forced"); ctl = await workletPitch(); }
  catch (e) {
    console.warn("AudioWorklet 無法使用，改用備用方式", e);
    try { ctl = scriptPitch(); } catch (e2) { ctl = null; }
  }
  if (!ctl) {
    ["keyDown", "keyUp", "keyReset"].forEach(id => $(id).disabled = true);
    $("keyHint").textContent = "此裝置不支援";
    return;
  }
  merge.disconnect();
  merge.connect(ctl.node);
  ctl.node.connect(master);
  pitchNode = ctl;
  applyKey();
}
function applyKey() {
  const v = $("keyVal");
  v.textContent = keyShift === 0 ? "原調" : (keyShift > 0 ? "+" + keyShift : "−" + (-keyShift));
  $("keyReset").classList.toggle("changed", keyShift !== 0);
  $("keyHint").textContent = keyShift === 0 ? "目前音高" : "點這裡回原調";
  $("keyDown").disabled = keyShift <= KEY_MIN;
  $("keyUp").disabled = keyShift >= KEY_MAX;
  if (pitchNode) pitchNode.set(keyShift);
}
$("keyDown").onclick  = () => { setupAudio(); if (keyShift > KEY_MIN) keyShift--; applyKey(); };
$("keyUp").onclick    = () => { setupAudio(); if (keyShift < KEY_MAX) keyShift++; applyKey(); };
$("keyReset").onclick = () => { setupAudio(); keyShift = 0; applyKey(); };

function ramp(g, v, instant) {
  const t = ctx.currentTime;
  g.gain.cancelScheduledValues(t);
  if (instant) g.gain.setValueAtTime(v, t);
  else { g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(v, t + 0.12); }
}
function applyVoice(instant) {
  $("vVocal").setAttribute("aria-pressed", voice === "vocal");
  $("vKara").setAttribute("aria-pressed", voice === "kara");
  if (!audioOk) return;
  ramp(gRight, voice === "vocal" ? 1 : 0, instant);
  ramp(gLeft,  voice === "kara"  ? 1 : 0, instant);
}
function applyMute(instant) {
  if (audioOk) ramp(master, muted ? 0 : 1, instant);
  else video.muted = muted;
}
$("vVocal").onclick = () => { setupAudio(); voice = "vocal"; applyVoice(); };
$("vKara").onclick  = () => { setupAudio(); voice = "kara";  applyVoice(); };

/* ---------- 播放控制 ---------- */
video.crossOrigin = "anonymous";
function showMsg(t) { $("msg").textContent = t || ""; $("msg").classList.toggle("on", !!t); }

let currentSong = -1;
function openSong(i) {
  currentSong = i;
  setupAudio();                       // 必須在按下按鈕時啟動聲音
  $("now").textContent = `${i + 1}. ${SONGS[i]}`;
  $("list").classList.remove("on");
  $("player").classList.add("on");
  window.scrollTo(0, 0);
  showMsg("載入中…");
  video.src = fileFor(i);
  video.load();
  play();
  history.pushState({ song: i }, "");
}
function play() {
  setupAudio();
  const p = video.play();
  if (p && p.catch) p.catch(() => { showMsg(""); });
}
function closeSong() {
  if (typeof rec !== "undefined" && rec) stopRec();
  if (fsEl()) exitFull();
  video.pause();
  video.removeAttribute("src");
  video.load();
  showMsg("");
  $("player").classList.remove("on");
  $("list").classList.add("on");
  releaseWake();
}
$("back").onclick = () => { if (history.state && history.state.song !== undefined) history.back(); else closeSong(); };
window.addEventListener("popstate", () => { if ($("player").classList.contains("on")) closeSong(); });

$("play").onclick = () => { if (video.paused || video.ended) play(); else video.pause(); };
$("loop").onclick = () => { video.loop = !video.loop; $("loop").setAttribute("aria-pressed", video.loop); };
video.addEventListener("click", () => { if (!stage.classList.contains("fs")) $("play").click(); });

function syncPlay() {
  const playing = !video.paused && !video.ended;
  $("icoPlay").style.display = playing ? "none" : "";
  $("icoPause").style.display = playing ? "" : "none";
  $("playTxt").textContent = playing ? "暫停" : "播放";
  playing ? holdWake() : releaseWake();
}
["play", "pause", "ended"].forEach(e => video.addEventListener(e, syncPlay));
video.addEventListener("playing", () => showMsg(""));
video.addEventListener("waiting", () => showMsg("載入中…"));
video.addEventListener("canplay", () => showMsg(""));
video.addEventListener("error", () => { if (video.getAttribute("src")) showMsg("影片無法播放，請檢查網路後再試一次。"); });

/* 進度條 */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const seek = $("seek");
let dragging = false;
function paintSeek() { seek.style.setProperty("--p", (seek.value / 10) + "%"); }
video.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(video.duration); });
video.addEventListener("timeupdate", () => {
  $("cur").textContent = fmt(video.currentTime);
  if (!dragging && video.duration) { seek.value = Math.round(video.currentTime / video.duration * 1000); paintSeek(); }
});
seek.addEventListener("input", () => {
  dragging = true; paintSeek();
  if (video.duration) $("cur").textContent = fmt(seek.value / 1000 * video.duration);
});
seek.addEventListener("change", () => {
  if (video.duration) video.currentTime = seek.value / 1000 * video.duration;
  dragging = false;
});

/* ---------- 全螢幕 ----------
   電腦、Android：整個影片區變全螢幕，下方有大按鈕（播放、人聲／伴奏、離開）。
   iPhone：改用手機內建的全螢幕播放器。 */
const stage = $("stage");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const canFs = !!(stage.requestFullscreen || stage.webkitRequestFullscreen);
let idleTimer = null;
function wakeBar() {
  stage.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!video.paused) stage.classList.add("idle"); }, 3000);
}
function syncFsBar() {
  $("fsPlay").textContent = (!video.paused && !video.ended) ? "暫停" : "播放";
  $("fsVoice").textContent = voice === "vocal" ? "有人聲" : "純伴奏";
}
async function enterFull() {
  setupAudio();
  if (canFs) {
    try {
      await (stage.requestFullscreen ? stage.requestFullscreen({ navigationUI: "hide" }) : stage.webkitRequestFullscreen());
      try { await screen.orientation.lock("landscape"); } catch (e) {}
      return;
    } catch (e) {}
  }
  if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); } catch (e) {} }
}
function exitFull() {
  try { screen.orientation.unlock(); } catch (e) {}
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
function onFsChange() {
  const on = fsEl() === stage;
  stage.classList.toggle("fs", on);
  if (on) { syncFsBar(); wakeBar(); } else { stage.classList.remove("idle"); try { screen.orientation.unlock(); } catch (e) {} }
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
$("full").onclick = enterFull;
$("fsExit").onclick = e => { e.stopPropagation(); exitFull(); };
$("fsPlay").onclick = e => { e.stopPropagation(); $("play").click(); wakeBar(); };
$("fsVoice").onclick = e => { e.stopPropagation(); setupAudio(); voice = voice === "vocal" ? "kara" : "vocal"; applyVoice(); syncFsBar(); wakeBar(); };
stage.addEventListener("pointerdown", () => { if (stage.classList.contains("fs")) wakeBar(); });
["play", "pause", "ended"].forEach(e => video.addEventListener(e, () => { syncFsBar(); if (stage.classList.contains("fs")) wakeBar(); }));
video.addEventListener("dblclick", () => fsEl() ? exitFull() : enterFull());

/* ---------- 唱歌錄音（試做） ----------
   伴奏（含升降 Key）＋麥克風的歌聲，一起錄成一個聲音檔。錄音只存在這台手機的這次開啟中。 */
const RECORD_ON = true;
let rec = null;            // 錄音中的資料
const takes = [];          // 錄好的檔案
const takePlayer = new Audio();
if (RECORD_ON && navigator.mediaDevices && window.MediaRecorder) $("recBox").hidden = false;

function pickType() {
  for (const t of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  return "";
}
function setAudioSession(t) { if (navigator.audioSession) { try { navigator.audioSession.type = t; } catch (e) {} } }

async function startRec() {
  setupAudio();
  if (!audioOk) { $("recHint").textContent = "這台裝置無法錄音。"; return; }
  let stream;
  try {
    setAudioSession("play-and-record");
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    setAudioSession("playback");
    $("recHint").textContent = "沒有拿到麥克風的使用許可。請在跳出的視窗按「允許」，或到手機設定裡允許瀏覽器使用麥克風。";
    return;
  }
  if (ctx.state !== "running") await ctx.resume();
  // 伴奏切到純伴奏，回到開頭
  voice = "kara"; applyVoice(true); syncFsBar();
  video.pause(); video.currentTime = 0;
  const wasLoop = video.loop; video.loop = false; $("loop").setAttribute("aria-pressed", false);

  // 錄音的聲音路線：伴奏（延遲一點對齊歌聲）＋麥克風
  const dest = ctx.createMediaStreamDestination();
  const limiter = ctx.createDynamicsCompressor();   // 避免聲音太大爆音
  limiter.threshold.value = -6; limiter.knee.value = 6; limiter.ratio.value = 12;
  limiter.attack.value = 0.003; limiter.release.value = 0.25;
  limiter.connect(dest);
  const track = stream.getAudioTracks()[0];
  const inLat = (track.getSettings && track.getSettings().latency) || 0;
  let lat = (ctx.outputLatency || 0) + (ctx.baseLatency || 0) + inLat;
  if (!lat) lat = 0.12;
  lat = Math.min(Math.max(lat, 0), 0.5);
  const delay = ctx.createDelay(1); delay.delayTime.value = lat;
  const musicGain = ctx.createGain(); musicGain.gain.value = 0.7;
  master.connect(delay); delay.connect(musicGain); musicGain.connect(limiter);
  const mic = ctx.createMediaStreamSource(stream);
  const micGain = ctx.createGain(); micGain.gain.value = 1.0;
  mic.connect(micGain); micGain.connect(limiter);

  const type = pickType();
  const mr = new MediaRecorder(dest.stream, type ? { mimeType: type } : undefined);
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec = { stream, mr, chunks, nodes: [delay, musicGain, mic, micGain, limiter], wasLoop, song: currentSong, t0: 0, timer: null, stopping: false };
  mr.onstop = () => finishRec(rec);

  $("recBtn").classList.add("on"); $("recTxt").textContent = "停止錄音";
  $("recHint").textContent = "預備……";
  // 倒數 3 秒
  const cd = $("count");
  for (const n of [3, 2, 1]) {
    if (!rec || rec.stopping) return;
    cd.textContent = n; cd.classList.add("on");
    await new Promise(r => setTimeout(r, 1000));
  }
  cd.classList.remove("on");
  if (!rec || rec.stopping) return;
  mr.start(1000);
  rec.t0 = Date.now();
  $("recBadge").classList.add("on");
  rec.timer = setInterval(() => { $("recTime").textContent = fmt((Date.now() - rec.t0) / 1000); }, 500);
  $("recHint").textContent = "錄音中，唱完或按「停止錄音」就會存好。";
  play();
}
function stopRec() {
  if (!rec || rec.stopping) return;
  rec.stopping = true;
  $("count").classList.remove("on");
  video.pause();
  if (rec.mr.state !== "inactive") rec.mr.stop();
  else finishRec(rec);
}
function finishRec(r) {
  clearInterval(r.timer);
  r.stream.getTracks().forEach(t => t.stop());
  r.nodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
  setAudioSession("playback");
  video.loop = r.wasLoop; $("loop").setAttribute("aria-pressed", video.loop);
  $("recBadge").classList.remove("on");
  $("recBtn").classList.remove("on"); $("recTxt").textContent = "開始錄我唱的歌";
  if (rec === r) rec = null;
  if (!r.t0 || !r.chunks.length) { $("recHint").textContent = "沒有錄到聲音，可以再試一次。"; return; }
  const secs = (Date.now() - r.t0) / 1000;
  const blob = new Blob(r.chunks, { type: r.mr.mimeType || "audio/mp4" });
  takes.unshift({ blob, url: URL.createObjectURL(blob), secs, song: r.song, n: takes.length + 1, key: keyShift });
  $("recHint").textContent = "錄好了！可以按「聽」，滿意的話按「存檔」存到手機。（關掉 App 後，沒存檔的錄音會消失）";
  renderTakes();
}
function renderTakes() {
  const box = $("takes"); box.innerHTML = "";
  takes.forEach(t => {
    const d = document.createElement("div"); d.className = "take";
    const keyTxt = t.key ? `，Key ${t.key > 0 ? "+" + t.key : "−" + (-t.key)}` : "";
    d.innerHTML = `<div><b></b><small></small></div><button class="pl">聽</button><button class="sv">存檔</button><button class="del">刪除</button>`;
    d.querySelector("b").textContent = `第 ${t.n} 次`;
    d.querySelector("small").textContent = `${SONGS[t.song] || ""}・${fmt(t.secs)}${keyTxt}`;
    const pl = d.querySelector(".pl");
    pl.dataset.url = t.url;
    pl.onclick = () => {
      if (takePlayer.src === t.url && !takePlayer.paused) { takePlayer.pause(); return; }
      video.pause();
      takePlayer.src = t.url; takePlayer.play().catch(() => {});
    };
    d.querySelector(".sv").onclick = () => saveTake(t);
    d.querySelector(".del").onclick = () => {
      if (takePlayer.src === t.url) takePlayer.pause();
      URL.revokeObjectURL(t.url); takes.splice(takes.indexOf(t), 1); renderTakes();
    };
    box.appendChild(d);
  });
}
async function saveTake(t) {
  const ext = (t.blob.type.includes("mp4") ? "m4a" : "webm");
  const name = `我的錄音-${String(t.song + 1).padStart(2, "0")}-${SONGS[t.song] || "歌"}-${t.n}.${ext}`;
  const file = new File([t.blob], name, { type: t.blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = t.url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function syncTakeButtons() {
  document.querySelectorAll(".take .pl").forEach(b => { b.textContent = (!takePlayer.paused && takePlayer.src === b.dataset.url) ? "暫停" : "聽"; });
}
["play", "pause", "ended"].forEach(e => takePlayer.addEventListener(e, syncTakeButtons));
$("recBtn").onclick = () => rec ? stopRec() : startRec();
video.addEventListener("ended", () => { if (rec) stopRec(); });
video.addEventListener("play", () => { if (!takePlayer.paused) takePlayer.pause(); });

/* 播放時不讓螢幕自動關閉 */
let wake = null;
async function holdWake() { try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} }
function releaseWake() { if (wake) { wake.release().catch(() => {}); wake = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (!video.paused) holdWake(); if (ctx && ctx.state !== "running") ctx.resume(); }
});
</script>
</body>
</html>
